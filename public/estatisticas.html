<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas - Loterias IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- ✅ Firebase SDK (obrigatório para auth) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    
    <style>
        /* Estilos existentes... */
        .stats-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .lottery-grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .lottery-card-stats { background: var(--bg-secondary); padding: 15px; border-radius: var(--radius); border: 2px solid var(--border); cursor: pointer; transition: all 0.3s; text-align: center; }
        .lottery-card-stats:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .lottery-card-stats.active { border-color: #38bdf8; background: var(--bg-card); }
        .stats-cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .stats-card { background: var(--bg-card); border-radius: var(--radius); padding: 15px; border: 2px solid var(--border); }
        .stats-card h4 { font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: 8px; }
        .stats-list { max-height: 300px; overflow-y: auto; }
        .stats-item { display: flex; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .stats-item .numero { font-weight: 600; color: #38bdf8; }
        .stats-item .numero-pro { font-weight: 600; color: #f59e0b; cursor: pointer; }
        .stats-item .numero-pro:hover { filter: blur(2px); }
        .stats-item .quantidade { color: #f59e0b; }
        .stats-item:hover { background: rgba(56, 189, 248, 0.1); }
        .pro-badge-stats { display: inline-block; background: linear-gradient(135deg, #f59e0b, #eab308); color: #1e293b; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-left: 8px; }
        .pro-overlay { background: rgba(0,0,0,0.7); border-radius: 8px; padding: 20px; text-align: center; margin: 20px 0; }
        .periodo-filtros { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .periodo-btn { padding: 8px 16px; border: 2px solid var(--border); border-radius: 30px; background: var(--bg-card); cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .periodo-btn.ativo { background: #f59e0b; color: #1e293b; border-color: #f59e0b; font-weight: 600; }
        .info-periodo-stats { display: flex; gap: 15px; margin-top: 15px; padding: 10px; background: rgba(56, 189, 248, 0.1); border-radius: 12px; flex-wrap: wrap; }
        .loading-stats { text-align: center; padding: 40px; color: var(--text-secondary); }
        .error-stats { background: rgba(239, 68, 68, 0.1); border: 2px solid #ef4444; padding: 15px; border-radius: var(--radius); text-align: center; color: #fca5a5; }
        .footer-stats { margin-top: 40px; margin-bottom: 20px; text-align: center; }
        .btn-footer { background: #64748b; border: none; padding: 10px 25px; border-radius: 30px; color: white; font-weight: 600; cursor: pointer; margin: 5px; }
        .stats-note { font-size: 11px; color: #f59e0b; margin-top: 10px; text-align: center; }
        .header-logo { font-size: 32px; min-width: 50px; text-align: center; }
        .loteca-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .loteca-jogo-card { background: var(--bg-card); border-radius: var(--radius); padding: 12px; border: 2px solid var(--border); }
        .loteca-jogo-card h5 { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
        .loteca-bar { display: flex; gap: 4px; height: 20px; margin: 4px 0; }
        .loteca-bar .casa { background: #38bdf8; height: 100%; border-radius: 3px; }
        .loteca-bar .empate { background: #f59e0b; height: 100%; border-radius: 3px; }
        .loteca-bar .fora { background: #ef4444; height: 100%; border-radius: 3px; }
        .loteca-legend { display: flex; gap: 15px; font-size: 11px; color: var(--text-secondary); margin-top: 6px; flex-wrap: wrap; }
        @media (max-width: 768px) { .stats-cards-grid { grid-template-columns: 1fr; } .lottery-grid-stats { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-logo">🎰</div>
            <div class="header-text">
                <h1>🧠 Loterias V.6.1 <span class="version-badge">ESTATÍSTICAS</span></h1>
                <p class="header-subtitle">Análise completa de números, duplas, tríades, times e meses</p>
            </div>
            <div class="header-logo">🎯</div>
        </div>
    </div>

    <div class="stats-container">
        <div class="lottery-grid-stats" id="lotteryGridStats"></div>
        
        <div class="card">
            <h4>📅 Período (Baseado em data real)</h4>
            <div class="periodo-filtros" id="periodoFiltros">
                <button class="periodo-btn ativo" data-periodo="all">Todos</button>
                <button class="periodo-btn" data-periodo="1">1 Ano</button>
                <button class="periodo-btn" data-periodo="3">3 Anos</button>
                <button class="periodo-btn" data-periodo="5">5 Anos</button>
                <button class="periodo-btn" data-periodo="7">7 Anos</button>
                <button class="periodo-btn" data-periodo="9">9 Anos</button>
            </div>
            <div id="periodoInfo"></div>
        </div>
        
        <div id="estatisticasContent"><div class="loading-stats">📊 Carregando estatísticas...</div></div>
        
        <div class="footer-stats">
            <button class="btn-footer" onclick="window.location.href='index.html'">← Voltar ao Sistema</button>
            <div style="margin-top: 15px; font-size: 11px; color: var(--text-secondary);">© 2025 Loterias IA</div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÕES
        // ============================================
        const API_URL = 'https://loterias-ia.vercel.app/api/statistics';
        
        // 🔒 Configuração do Firebase - AGORA VINDO DO BACKEND
        // A página busca a configuração do backend, não tem chaves expostas
        let firebaseConfig = null;
        let isUserPro = false;
        let loteriaAtualStats = 'megasena';
        let periodoSelecionadoStats = 'all';
        let dadosAtuaisStats = null;
        
        // ============================================
        // 🔒 BUSCAR CONFIGURAÇÃO DO FIREBASE DO BACKEND
        // ============================================
        async function carregarConfigFirebase() {
            try {
                const response = await fetch('/api/config/firebase');
                const data = await response.json();
                firebaseConfig = data;
                
                // Inicializa Firebase com a configuração do backend
                if (!firebase.apps || firebase.apps.length === 0) {
                    firebase.initializeApp(firebaseConfig);
                }
                
                console.log('✅ Firebase configurado com segurança');
                return true;
            } catch (error) {
                console.error('❌ Erro ao carregar configuração do Firebase:', error);
                return false;
            }
        }
        
        // ============================================
        // CONFIGURAÇÕES DAS LOTERIAS
        // ============================================
        const LOTERIAS_STATS = {
            megasena: { nome: 'Mega-Sena', icone: '💰', numerosCSV: 6, maxNumero: 60, incluirZero: false },
            quina: { nome: 'Quina', icone: '🎯', numerosCSV: 5, maxNumero: 80, incluirZero: false },
            lotofacil: { nome: 'Lotofácil', icone: '🍀', numerosCSV: 15, maxNumero: 25, incluirZero: false },
            lotomania: { nome: 'Lotomania', icone: '🎪', numerosCSV: 20, maxNumero: 99, incluirZero: true, observacao: 'Sorteia 20 números entre 00 e 99' },
            duplasena: { nome: 'Dupla Sena', icone: '🎲', numerosCSV: 6, maxNumero: 50, incluirZero: false },
            timemania: { nome: 'Timemania', icone: '⚽', numerosCSV: 7, maxNumero: 80, incluirZero: false, temElementoExtra: true, nomeElemento: 'Time do Coração' },
            milionaria: { nome: '+Milionária', icone: '💎', numerosCSV: 6, maxNumero: 50, incluirZero: false },
            loteca: { nome: 'Loteca', icone: '⚽', numerosCSV: 14, maxNumero: 3, incluirZero: true },
            diadesorte: { nome: 'Dia de Sorte', icone: '📅', numerosCSV: 7, maxNumero: 31, incluirZero: false, temElementoExtra: true, nomeElemento: 'Mês de Sorte' },
            supersete: { nome: 'Super Sete', icone: '🌟', numerosCSV: 7, maxNumero: 9, incluirZero: true }
        };
        
        // ============================================
        // VERIFICAR USUÁRIO PRO (via Firebase)
        // ============================================
        function verificarUsuarioPro() {
            firebase.auth().onAuthStateChanged(async (user) => {
                if (user) {
                    try {
                        // 🔒 Busca o status PRO via API segura
                        const response = await fetch('/api/user/status', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ uid: user.uid })
                        });
                        const data = await response.json();
                        isUserPro = data.isPro || false;
                        console.log('📊 Usuário PRO:', isUserPro);
                    } catch(e) {
                        isUserPro = false;
                        console.log('📊 Usuário não encontrado');
                    }
                } else {
                    isUserPro = false;
                    console.log('📊 Nenhum usuário logado');
                }
                await carregarEstatisticas();
            });
        }
        
        // ============================================
        // FUNÇÕES DE FORMATAÇÃO
        // ============================================
        function formatarNumero(numero, incluirZero) {
            if (!isUserPro) return '<span class="numero-pro" title="🔒 Disponível no Plano PRO">⭐⭐ PRO ⭐⭐</span>';
            if (numero === 0 && incluirZero) return '00';
            return String(numero).padStart(2, '0');
        }
        
        function formatarDupla(dupla, incluirZero) {
            if (!isUserPro) return '(⭐⭐, ⭐⭐)';
            return `(${formatarNumero(dupla[0], incluirZero)}, ${formatarNumero(dupla[1], incluirZero)})`;
        }
        
        function formatarTripla(tripla, incluirZero) {
            if (!isUserPro) return '(⭐⭐, ⭐⭐, ⭐⭐)';
            return `(${formatarNumero(tripla[0], incluirZero)}, ${formatarNumero(tripla[1], incluirZero)}, ${formatarNumero(tripla[2], incluirZero)})`;
        }
        
        // ============================================
        // CARREGAR ESTATÍSTICAS
        // ============================================
        async function carregarEstatisticas() {
            const container = document.getElementById('estatisticasContent');
            container.innerHTML = '<div class="loading-stats">📊 Carregando estatísticas...</div>';
            
            try {
                const url = `${API_URL}?lottery=${loteriaAtualStats}&period=${periodoSelecionadoStats}`;
                console.log(`📥 Buscando estatísticas: ${url}`);
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Erro ao carregar estatísticas');
                }
                
                dadosAtuaisStats = data;
                await atualizarPeriodoInfo(data);
                await renderizarEstatisticas(data);
                
            } catch (error) {
                console.error('❌ Erro ao carregar estatísticas:', error);
                container.innerHTML = `
                    <div class="error-stats">
                        ⚠️ ${error.message || 'Erro ao carregar dados. Tente novamente mais tarde.'}
                        <br><br>
                        <button onclick="carregarEstatisticas()" style="background: #8b5cf6; border: none; padding: 8px 20px; border-radius: 30px; color: white; font-weight: 600; cursor: pointer;">
                            🔄 Tentar novamente
                        </button>
                    </div>
                `;
            }
        }
        
        // ============================================
        // ATUALIZAR PERÍODO
        // ============================================
        async function atualizarPeriodoInfo(data) {
            const periodoTexto = periodoSelecionadoStats === 'all' 
                ? `Todos os concursos (${data.filteredDraws || data.totalDraws || 0} concursos)`
                : `${periodoSelecionadoStats} ano(s) (${data.filteredDraws || 0} concursos)`;
            
            document.getElementById('periodoInfo').innerHTML = `
                <p>📊 ${periodoTexto}</p>
                <div class="info-periodo-stats">
                    <div><strong>📅 DATA INÍCIO:</strong> ${data.dataInicio || 'N/A'}</div>
                    <div><strong>📅 DATA FIM:</strong> ${data.dataFim || 'N/A'}</div>
                    <div><strong>📊 Total de concursos:</strong> ${data.totalDraws || 0}</div>
                    <div><strong>📊 Período filtrado:</strong> ${data.filteredDraws || 0}</div>
                </div>
            `;
        }
        
        // ============================================
        // RENDERIZAR ESTATÍSTICAS
        // ============================================
        async function renderizarEstatisticas(data) {
            const container = document.getElementById('estatisticasContent');
            const config = LOTERIAS_STATS[loteriaAtualStats];
            
            // LOTECA
            if (loteriaAtualStats === 'loteca' && data.loteca) {
                const proWarning = !isUserPro ? `
                    <div class="pro-overlay" style="background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; margin-bottom: 20px;">
                        <span class="pro-badge-stats">⭐ PLANO PRO ⭐</span>
                        <p style="margin-top: 10px; font-size: 13px;">Faça login com uma conta PRO para visualizar todos os números e estatísticas completas!</p>
                        <button onclick="window.location.href='index.html'" style="background: linear-gradient(135deg, #f59e0b, #eab308); border: none; padding: 8px 20px; border-radius: 30px; color: #1e293b; font-weight: 600; cursor: pointer; margin-top: 10px;">⭐ IR PARA O SISTEMA</button>
                    </div>
                ` : '';
                
                const { frequenciaGlobal, frequenciaPorJogo } = data.loteca;
                
                let html = `
                    ${proWarning}
                    <div class="stats-cards-grid">
                        <div class="stats-card">
                            <h4>📊 FREQUÊNCIA GLOBAL</h4>
                            <div class="stats-list">
                                ${frequenciaGlobal.map(item => `
                                    <div class="stats-item">
                                        <span class="${isUserPro ? 'numero' : 'numero-pro'}">${isUserPro ? item.resultado : '⭐⭐ PRO ⭐⭐'}</span>
                                        <span class="quantidade">${item.quantidade} vez(es)</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                    
                    <div style="margin-top: 20px;">
                        <h4 style="color: var(--text-secondary); margin-bottom: 15px;">📊 FREQUÊNCIA POR JOGO</h4>
                        <div class="loteca-stats-grid">
                            ${frequenciaPorJogo.map(jogo => `
                                <div class="loteca-jogo-card">
                                    <h5>⚽ Jogo ${jogo.jogo}</h5>
                                    <div class="loteca-bar">
                                        <div class="casa" style="width: ${(jogo.casa / jogo.total * 100) || 0}%;"></div>
                                        <div class="empate" style="width: ${(jogo.empate / jogo.total * 100) || 0}%;"></div>
                                        <div class="fora" style="width: ${(jogo.fora / jogo.total * 100) || 0}%;"></div>
                                    </div>
                                    <div class="loteca-legend">
                                        <span>🏠 Casa: ${jogo.casa}</span>
                                        <span>🤝 Empate: ${jogo.empate}</span>
                                        <span>✈️ Fora: ${jogo.fora}</span>
                                        <span>📊 Total: ${jogo.total}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div style="margin-top: 20px; padding: 15px; background: rgba(56, 189, 248, 0.1); border-radius: 12px; text-align: center;">
                        <div style="font-size: 13px; color: var(--text-secondary);">
                            📊 Baseado em <strong>${data.filteredDraws || data.totalDraws || 0}</strong> concursos | 
                            🎯 ${config.numerosCSV} jogos por concurso
                        </div>
                    </div>
                `;
                
                container.innerHTML = html;
                return;
            }
            
            // TIMEMANIA e DIA DE SORTE
            const maisSorteados = data.maisSorteados || [];
            const menosSorteados = data.menosSorteados || [];
            const duplas = data.duplas || [];
            const triplas = data.triplas || [];
            const elementosExtras = data.elementosExtras || [];
            const temElementoExtra = config.temElementoExtra || false;
            
            if (maisSorteados.length === 0 && menosSorteados.length === 0) {
                container.innerHTML = `
                    <div class="error-stats">
                        ⚠️ Nenhum dado disponível para ${config.nome} no período selecionado.
                        <br>
                        <small>Tente alterar o período ou selecionar outra loteria.</small>
                    </div>
                `;
                return;
            }
            
            const proWarning = !isUserPro ? `
                <div class="pro-overlay" style="background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; margin-bottom: 20px;">
                    <span class="pro-badge-stats">⭐ PLANO PRO ⭐</span>
                    <p style="margin-top: 10px; font-size: 13px;">Faça login com uma conta PRO para visualizar todos os números e estatísticas completas!</p>
                    <button onclick="window.location.href='index.html'" style="background: linear-gradient(135deg, #f59e0b, #eab308); border: none; padding: 8px 20px; border-radius: 30px; color: #1e293b; font-weight: 600; cursor: pointer; margin-top: 10px;">⭐ IR PARA O SISTEMA</button>
                </div>
            ` : '';
            
            const observacaoHtml = config.observacao ? `<div class="stats-note">ℹ️ ${config.observacao}</div>` : '';
            
            let elementosExtrasHtml = '';
            if (temElementoExtra && elementosExtras.length > 0) {
                const icone = loteriaAtualStats === 'timemania' ? '⚽' : '📅';
                const titulo = config.nomeElemento || 'Elemento Extra';
                elementosExtrasHtml = `
                    <div class="stats-card">
                        <h4>${icone} ${titulo}s MAIS SORTEADOS</h4>
                        <div class="stats-list">
                            ${elementosExtras.map(item => `
                                <div class="stats-item">
                                    <span class="${isUserPro ? 'numero' : 'numero-pro'}">${isUserPro ? item.nome : '⭐⭐ PRO ⭐⭐'}</span>
                                    <span class="quantidade">${item.quantidade} vez(es)</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            const html = `
                ${proWarning}
                ${observacaoHtml}
                <div class="stats-cards-grid">
                    <div class="stats-card">
                        <h4>🔢 MAIS SORTEADOS (Top 20)</h4>
                        <div class="stats-list">
                            ${maisSorteados.length > 0 ? maisSorteados.map(item => `
                                <div class="stats-item">
                                    <span class="${isUserPro ? 'numero' : 'numero-pro'}">${formatarNumero(item.numero, config.incluirZero)}</span>
                                    <span class="quantidade">${item.quantidade} vez(es)</span>
                                </div>
                            `).join('') : `
                                <div class="stats-item" style="justify-content: center; color: #94a3b8; padding: 20px;">
                                    Nenhum dado disponível
                                </div>
                            `}
                        </div>
                    </div>
                    
                    <div class="stats-card">
                        <h4>🔢 MENOS SORTEADOS (Bottom 20)</h4>
                        <div class="stats-list">
                            ${menosSorteados.length > 0 ? menosSorteados.map(item => `
                                <div class="stats-item">
                                    <span class="${isUserPro ? 'numero' : 'numero-pro'}">${formatarNumero(item.numero, config.incluirZero)}</span>
                                    <span class="quantidade">${item.quantidade} vez(es)</span>
                                </div>
                            `).join('') : `
                                <div class="stats-item" style="justify-content: center; color: #94a3b8; padding: 20px;">
                                    Nenhum dado disponível
                                </div>
                            `}
                        </div>
                    </div>
                    
                    <div class="stats-card">
                        <h4>👥 DUPLAS MAIS SORTEADAS</h4>
                        <div class="stats-list">
                            ${duplas.length > 0 ? duplas.map(item => `
                                <div class="stats-item">
                                    <span class="${isUserPro ? 'numero' : 'numero-pro'}">${formatarDupla(item.dupla, config.incluirZero)}</span>
                                    <span class="quantidade">${item.quantidade} vez(es)</span>
                                </div>
                            `).join('') : `
                                <div class="stats-item" style="justify-content: center; color: #94a3b8; padding: 20px;">
                                    Nenhuma dupla encontrada
                                </div>
                            `}
                        </div>
                    </div>
                    
                    <div class="stats-card">
                        <h4>🔢 TRÍADES MAIS SORTEADAS</h4>
                        <div class="stats-list">
                            ${triplas.length > 0 ? triplas.map(item => `
                                <div class="stats-item">
                                    <span class="${isUserPro ? 'numero' : 'numero-pro'}">${formatarTripla(item.tripla, config.incluirZero)}</span>
                                    <span class="quantidade">${item.quantidade} vez(es)</span>
                                </div>
                            `).join('') : `
                                <div class="stats-item" style="justify-content: center; color: #94a3b8; padding: 20px;">
                                    Nenhuma tríade encontrada
                                </div>
                            `}
                        </div>
                    </div>
                    ${elementosExtrasHtml}
                </div>
                
                <div style="margin-top: 20px; padding: 15px; background: rgba(56, 189, 248, 0.1); border-radius: 12px; text-align: center;">
                    <div style="font-size: 13px; color: var(--text-secondary);">
                        📊 Baseado em <strong>${data.filteredDraws || data.totalDraws || 0}</strong> concursos | 
                        🎯 ${config.numerosCSV} números por concurso
                        ${temElementoExtra ? ` | ${config.nomeElemento || 'Elemento Extra'} incluído` : ''}
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        // ============================================
        // SELECIONAR LOTERIA
        // ============================================
        async function selecionarLoteriaStats(loteria) {
            loteriaAtualStats = loteria;
            document.querySelectorAll('.lottery-card-stats').forEach(c => c.classList.remove('active'));
            document.getElementById(`card-stats-${loteria}`)?.classList.add('active');
            await carregarEstatisticas();
        }
        
        // ============================================
        // CARREGAR GRID
        // ============================================
        function carregarGrid() {
            const grid = document.getElementById('lotteryGridStats');
            grid.innerHTML = Object.entries(LOTERIAS_STATS).map(([id, c]) => `
                <div class="lottery-card-stats ${id === 'megasena' ? 'active' : ''}" 
                     onclick="selecionarLoteriaStats('${id}')" 
                     id="card-stats-${id}">
                    <h3>${c.icone} ${c.nome}</h3>
                    <p class="rules">${c.numerosCSV} números • 1 a ${c.maxNumero}${c.temElementoExtra ? ` + ${c.nomeElemento || 'Extra'}` : ''}</p>
                </div>
            `).join('');
        }
        
        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        async function init() {
            carregarGrid();
            
            document.querySelectorAll('.periodo-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    document.querySelectorAll('.periodo-btn').forEach(b => b.classList.remove('ativo'));
                    btn.classList.add('ativo');
                    periodoSelecionadoStats = btn.dataset.periodo;
                    await carregarEstatisticas();
                });
            });
            
            // 🔒 Carrega configuração do Firebase do backend
            const configLoaded = await carregarConfigFirebase();
            
            if (configLoaded) {
                // ✅ Verifica usuário PRO
                verificarUsuarioPro();
            } else {
                // ⚠️ Fallback: usuário como FREE
                isUserPro = false;
                await carregarEstatisticas();
            }
        }
        
        window.selecionarLoteriaStats = selecionarLoteriaStats;
        window.carregarEstatisticas = carregarEstatisticas;
        
        init();
    </script>
</body>
</html>
